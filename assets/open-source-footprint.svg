<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="390" viewBox="0 0 1050 390" role="img" aria-labelledby="title desc">
  <title id="title">Dzhabrail Khalilov — open-source footprint</title>
  <desc id="desc">Twenty-six public repositories, two flagship products, and shipped contributions to established open-source projects.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d16"/>
      <stop offset="0.5" stop-color="#0d1422"/>
      <stop offset="1" stop-color="#11182a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#42d3ff"/>
      <stop offset="1" stop-color="#9b78ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#6879ff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#6879ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#a9b7d0" stroke-opacity="0.045"/>
    </pattern>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <clipPath id="frame"><rect width="1050" height="390" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1050" height="390" fill="url(#bg)"/>
    <rect width="1050" height="390" fill="url(#grid)"/>
    <circle cx="525" cy="215" r="260" fill="url(#glow)"/>

    <text x="42" y="48" fill="#f2f6ff" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="2.3">OPEN-SOURCE FOOTPRINT</text>
    <text x="1008" y="48" fill="#68748d" font-family="Consolas, monospace" font-size="11" text-anchor="end">PUBLIC SNAPSHOT · AUG 2026</text>
    <path d="M42 66H1008" stroke="#9caccc" stroke-opacity="0.12"/>

    <g fill="none" stroke-linecap="round">
      <path d="M434 184C372 157 350 137 330 132" stroke="#42d3ff" stroke-opacity="0.38" stroke-width="1.5"/>
      <path d="M434 246C377 270 352 284 330 286" stroke="#42d3ff" stroke-opacity="0.24" stroke-width="1.5"/>
      <path d="M616 184C680 157 701 137 720 132" stroke="#9b78ff" stroke-opacity="0.38" stroke-width="1.5"/>
      <path d="M616 246C678 270 700 284 720 286" stroke="#9b78ff" stroke-opacity="0.24" stroke-width="1.5"/>
      <circle cx="525" cy="215" r="104" stroke="#7791d9" stroke-opacity="0.10"/>
      <circle cx="525" cy="215" r="91" stroke="#7791d9" stroke-opacity="0.13" stroke-dasharray="3 8"/>
    </g>

    <g filter="url(#softShadow)">
      <rect x="42" y="88" width="288" height="88" rx="14" fill="#0d1625" stroke="#42d3ff" stroke-opacity="0.25"/>
      <rect x="42" y="242" width="288" height="88" rx="14" fill="#0d1625" stroke="#42d3ff" stroke-opacity="0.17"/>
      <rect x="720" y="88" width="288" height="88" rx="14" fill="#111426" stroke="#9b78ff" stroke-opacity="0.25"/>
      <rect x="720" y="242" width="288" height="88" rx="14" fill="#111426" stroke="#9b78ff" stroke-opacity="0.17"/>
    </g>

    <g font-family="Segoe UI, Arial, sans-serif">
      <text x="62" y="112" fill="#5fddff" font-size="10" font-weight="700" letter-spacing="1.5">CREATOR · FLAGSHIP</text>
      <text x="62" y="139" fill="#f1f5ff" font-size="18" font-weight="700">Click'n'Translate</text>
      <text x="62" y="159" fill="#8d9bb7" font-size="12">Desktop OCR · online + offline translation</text>
      <text x="309" y="116" fill="#d7e8ff" font-size="13" text-anchor="end">25 &#9733;</text>

      <text x="62" y="266" fill="#5fddff" font-size="10" font-weight="700" letter-spacing="1.5">CREATOR · AI TOOLING</text>
      <text x="62" y="293" fill="#f1f5ff" font-size="18" font-weight="700">Xynapse IDE</text>
      <text x="62" y="313" fill="#8d9bb7" font-size="12">AI-assisted development environment</text>
      <text x="309" y="270" fill="#d7e8ff" font-size="13" text-anchor="end">4 &#9733;</text>

      <text x="740" y="112" fill="#b493ff" font-size="10" font-weight="700" letter-spacing="1.5">SHIPPED</text>
      <text x="740" y="139" fill="#f1f5ff" font-size="18" font-weight="700">VidBee</text>
      <text x="740" y="159" fill="#8d9bb7" font-size="12">Portable Windows release · v1.3.13</text>
      <text x="987" y="116" fill="#e2d9ff" font-size="13" text-anchor="end">10.4K &#9733; upstream</text>

      <text x="740" y="266" fill="#b493ff" font-size="10" font-weight="700" letter-spacing="1.5">MERGED</text>
      <text x="740" y="293" fill="#f1f5ff" font-size="18" font-weight="700">Codex Multi-Launcher</text>
      <text x="740" y="313" fill="#8d9bb7" font-size="12">Russian + English localization</text>
      <text x="987" y="270" fill="#e2d9ff" font-size="13" text-anchor="end">121 &#9733; upstream</text>
    </g>

    <g transform="translate(525 215)">
      <circle r="68" fill="#0b1120" stroke="url(#accent)" stroke-width="2" filter="url(#softShadow)"/>
      <circle r="58" fill="none" stroke="#aebde1" stroke-opacity="0.10"/>
      <text y="-13" fill="#f3f6ff" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800" text-anchor="middle">26</text>
      <text y="8" fill="#b5c0d8" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.3" text-anchor="middle">PUBLIC REPOS</text>
      <rect x="-34" y="23" width="68" height="18" rx="9" fill="#54dcba" fill-opacity="0.10" stroke="#54dcba" stroke-opacity="0.25"/>
      <circle cx="-22" cy="32" r="3" fill="#54dcba"/>
      <text x="-14" y="36" fill="#8ce9d0" font-family="Consolas, monospace" font-size="9">SHIPPING</text>
    </g>

    <text x="525" y="365" fill="#697791" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Products I build · contributions that reached users · verified public data</text>
  </g>
  <rect x="0.75" y="0.75" width="1048.5" height="388.5" rx="21.25" fill="none" stroke="#c8d3ea" stroke-opacity="0.12" stroke-width="1.5"/>
</svg>
