<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">Projects of different sizes</title><desc id="desc">Star-count distribution of 39 upstream repositories.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/></linearGradient></defs>
<style>text{font-family:Inter,"Segoe UI",sans-serif}.title{fill:#f8fafc;font-size:27px;font-weight:700}.subtitle{fill:#a5b4c9;font-size:14px}.label{fill:#e2e8f0;font-size:15px}.value{fill:#f8fafc;font-size:17px;font-weight:700}.muted{fill:#94a3b8;font-size:12px}</style>
<rect x="1" y="1" width="998" height="388" rx="20" fill="url(#bg)" stroke="#30363d"/>
<text x="38" y="49" class="title">Projects of different sizes</text><text x="38" y="77" class="subtitle">39 repositories · each project counted once</text>
<text x="38" y="132" class="label">50k+ stars</text><rect x="240" y="117" width="59.5" height="18" rx="6" fill="url(#accent)"/><text x="855" y="132" class="value">4 projects</text><text x="38" y="180" class="label">10k–50k stars</text><rect x="240" y="165" width="119.0" height="18" rx="6" fill="url(#accent)"/><text x="855" y="180" class="value">8 projects</text><text x="38" y="228" class="label">1k–10k stars</text><rect x="240" y="213" width="193.3" height="18" rx="6" fill="url(#accent)"/><text x="855" y="228" class="value">13 projects</text><text x="38" y="276" class="label">Under 1k stars</text><rect x="240" y="261" width="208.2" height="18" rx="6" fill="url(#accent)"/><text x="855" y="276" class="value">14 projects</text><text x="38" y="339" class="muted">Repository popularity provides context; it does not measure adoption of my changes.</text>
<text x="38" y="370" class="muted">Verified 2026-10-20 · GitHub-recorded merges in external repositories</text>
</svg>
