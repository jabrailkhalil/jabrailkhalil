<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">Merged PR momentum</title>
  <desc id="desc">Cumulative timeline of 29 upstream pull requests merged between August 15 and September 14, 2026.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.52" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="998" height="468" rx="22" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { fill: #f8fafc; font-size: 28px; font-weight: 750; letter-spacing: -0.4px; }
    .subtitle { fill: #94a3b8; font-size: 14px; }
    .label { fill: #e2e8f0; font-size: 15px; font-weight: 600; }
    .value { fill: #cbd5e1; font-size: 14px; font-weight: 650; }
    .muted { fill: #64748b; font-size: 12px; }
    .metric { fill: #f8fafc; font-size: 22px; font-weight: 800; }
    .metric-label { fill: #94a3b8; font-size: 11px; font-weight: 650; letter-spacing: 0.8px; }
  </style>
  <text class="title" x="42" y="54">Merged PR momentum</text>
  <text class="subtitle" x="42" y="80">Cumulative upstream merges · Aug 15 – Sep 14, 2026</text>
