name: Render upstream profile section

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - metrics/upstream-section.md
      - .github/workflows/upstream-download-metrics.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render upstream section
        run: |
          python - <<'PY'
          from pathlib import Path

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          upstream = Path("metrics/upstream-section.md").read_text(encoding="utf-8").rstrip()
          start = readme.index("## 🛰️ Upstream open-source")
          end = readme.index("## 🧰 Core stack")
          readme_path.write_text(
              readme[:start] + upstream + "\n\n" + readme[end:],
              encoding="utf-8",
          )
          PY

      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: refresh upstream profile section"
          git push
