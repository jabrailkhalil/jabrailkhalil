name: Update upstream download metrics

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/upstream-download-metrics.yml

permissions:
  contents: write

concurrency:
  group: upstream-download-metrics
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Calculate and render GitHub release downloads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          entries = [
              ("TheAlgorithms/Python", "TheAlgorithms/Python", "~224k ⭐", 15228),
              ("Puppeteer", "puppeteer/puppeteer", "~95.6k ⭐", 15445),
              ("Roboflow Supervision", "roboflow/supervision", "~50.0k ⭐", 2557),
              ("react-admin", "marmelab/react-admin", "~26.9k ⭐", 11367),
              ("VidBee", "nexmoe/VidBee", "~10.6k ⭐", 469),
              ("Orval", "orval-labs/orval", "~6.5k ⭐", 4074),
              ("Agenta", "Agenta-AI/agenta", "~4.7k ⭐", 6693),
              ("html-to-markdown", "xberg-io/html-to-markdown", "865 ⭐", 482),
              ("LibreDB Studio", "libredb/libredb-studio", "628 ⭐", 782),
              ("agent-me", "jzjzzzzzzz/agent-me", "201 ⭐", 133),
              ("codex-multi-launcher", "JqyModi/codex-multi-launcher", "133 ⭐", 19),
              ("Termlens", "vyncint/termlens", "19 ⭐", 321),
              ("soft-track", "soft-track/soft-track", "11 ⭐", 59),
              ("DataSemVer", "IzanVil/datasemver", "1 ⭐", 7),
              ("Protos", "guillermomolina/protos", "0 ⭐", 315),
              ("sotto-action", "getsotto/sotto-action", "0 ⭐", 25),
              ("TraceOS", "junixlabs/traceos", "0 ⭐", 23),
          ]

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "jabrailkhalil-profile-metrics",
          }

          def release_downloads(repo: str) -> int:
              total = 0
              page = 1
              while True:
                  url = f"https://api.github.com/repos/{repo}/releases?per_page=100&page={page}"
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=30) as response:
                      releases = json.load(response)
                  for release in releases:
                      total += sum(int(asset.get("download_count", 0)) for asset in release.get("assets", []))
                  if len(releases) < 100:
                      return total
                  page += 1

          values = {repo: release_downloads(repo) for _, repo, _, _ in entries}
          combined = sum(values.values())

          def human(n: int) -> str:
              if n >= 1_000_000:
                  return f"{n / 1_000_000:.1f}M"
              if n >= 1_000:
                  return f"{n / 1_000:.1f}k"
              return str(n)

          out = {
              "metric": "GitHub release-asset downloads",
              "combined_downloads": combined,
              "combined_downloads_human": human(combined),
              "repositories": values,
          }

          metrics_dir = Path("metrics")
          metrics_dir.mkdir(exist_ok=True)
          (metrics_dir / "upstream-downloads.json").write_text(
              json.dumps(out, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          value = human(combined)
          label = "combined GitHub release downloads"
          label_width = 214
          value_width = 72
          total_width = label_width + value_width
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{total_width}" height="20" role="img" aria-label="{label}: {value}">
          <title>{label}: {value}</title>
          <linearGradient id="s" x2="0" y2="100%">
            <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
            <stop offset="1" stop-opacity=".1"/>
          </linearGradient>
          <clipPath id="r"><rect width="{total_width}" height="20" rx="3"/></clipPath>
          <g clip-path="url(#r)">
            <rect width="{label_width}" height="20" fill="#555"/>
            <rect x="{label_width}" width="{value_width}" height="20" fill="#0EA5E9"/>
            <rect width="{total_width}" height="20" fill="url(#s)"/>
          </g>
          <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
            <text x="{label_width / 2}" y="15" fill="#010101" fill-opacity=".3">{label}</text>
            <text x="{label_width / 2}" y="14">{label}</text>
            <text x="{label_width + value_width / 2}" y="15" fill="#010101" fill-opacity=".3">{value}</text>
            <text x="{label_width + value_width / 2}" y="14">{value}</text>
          </g>
          </svg>'''
          (metrics_dir / "upstream-downloads.svg").write_text(svg, encoding="utf-8")

          rows = []
          for display, repo, stars, pr in entries:
              download_badge = (
                  f"[![Downloads](https://img.shields.io/github/downloads/{repo}/total?style=flat-square&label=)]"
                  f"(https://github.com/{repo}/releases)"
              )
              rows.append(
                  f"| [{display}](https://github.com/{repo}) | {stars} | {download_badge} | "
                  f"[#{pr}](https://github.com/{repo}/pull/{pr}) |"
              )

          upstream = "\n".join([
              "## 🛰️ Upstream open-source",
              "",
              "**17 merged PRs across 17 upstream projects.** I contribute APIs, product fixes, packaging, CI, cross-platform behavior, regression tests, and documentation — not just drive-by edits.",
              "",
              "[![Merged upstream PRs](https://img.shields.io/badge/merged_upstream_PRs-17-2EA44F?style=flat-square&logo=github)](https://github.com/pulls?q=is%3Apr+author%3Ajabrailkhalil+is%3Amerged)",
              "[![Largest upstream](https://img.shields.io/badge/largest_upstream-224k%E2%AD%90-F59E0B?style=flat-square)](https://github.com/TheAlgorithms/Python)",
              "[![Combined upstream stars](https://img.shields.io/badge/combined_upstream_stars-420.6k%E2%AD%90-7C3AED?style=flat-square)](https://github.com/pulls?q=is%3Apr+author%3Ajabrailkhalil+is%3Amerged)",
              "[![Combined GitHub release downloads](https://raw.githubusercontent.com/jabrailkhalil/jabrailkhalil/main/metrics/upstream-downloads.svg)](https://github.com/pulls?q=is%3Apr+author%3Ajabrailkhalil+is%3Amerged)",
              "",
              "> Sorted by current upstream GitHub stars (September 2026 snapshot). Downloads are GitHub release-asset downloads — not unique users, and they exclude npm/PyPI/Store installs. Project names open the upstream repository; PR numbers open the merged contribution.",
              "",
              "| Project | Stars | Downloads | Merged PR |",
              "| --- | ---: | ---: | --- |",
              *rows,
          ])

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          start = readme.index("## 🛰️ Upstream open-source")
          end = readme.index("## 🧰 Core stack")
          readme_path.write_text(readme[:start] + upstream + "\n\n" + readme[end:], encoding="utf-8")
          PY

      - name: Commit refreshed metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md metrics/upstream-downloads.json metrics/upstream-downloads.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh upstream download metrics"
          git push
