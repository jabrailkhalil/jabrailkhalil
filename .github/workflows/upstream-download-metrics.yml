name: Update upstream download metrics

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
  push:
    branches: [main]
    paths:
      - .github/workflows/upstream-download-metrics.yml

permissions:
  contents: write

concurrency:
  group: upstream-download-metrics
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Calculate and render download metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          # One compact, clickable download badge per upstream project.
          # npm/PyPI values are rolling 30-day counts; crates.io and GitHub Releases are totals.
          entries = [
              (
                  "TheAlgorithms/Python", "TheAlgorithms/Python", "~224k ⭐", 15228,
                  "https://img.shields.io/badge/GitHub%20Releases-0-555?style=flat-square&labelColor=6B7280",
                  "https://github.com/TheAlgorithms/Python/releases",
              ),
              (
                  "Puppeteer", "puppeteer/puppeteer", "~95.6k ⭐", 15445,
                  "https://img.shields.io/npm/dm/puppeteer?style=flat-square&label=npm%2Fmonth&color=555&labelColor=6B7280",
                  "https://www.npmjs.com/package/puppeteer",
              ),
              (
                  "Roboflow Supervision", "roboflow/supervision", "~50.0k ⭐", 2557,
                  "https://img.shields.io/pypi/dm/supervision?style=flat-square&label=PyPI%2Fmonth&color=555&labelColor=6B7280",
                  "https://pypi.org/project/supervision/",
              ),
              (
                  "react-admin", "marmelab/react-admin", "~26.9k ⭐", 11367,
                  "https://img.shields.io/npm/dm/react-admin?style=flat-square&label=npm%2Fmonth&color=555&labelColor=6B7280",
                  "https://www.npmjs.com/package/react-admin",
              ),
              (
                  "VidBee", "nexmoe/VidBee", "~10.6k ⭐", 469,
                  "https://img.shields.io/github/downloads/nexmoe/VidBee/total?style=flat-square&label=GitHub%20Releases&color=555&labelColor=6B7280",
                  "https://github.com/nexmoe/VidBee/releases",
              ),
              (
                  "Orval", "orval-labs/orval", "~6.5k ⭐", 4074,
                  "https://img.shields.io/npm/dm/orval?style=flat-square&label=npm%2Fmonth&color=555&labelColor=6B7280",
                  "https://www.npmjs.com/package/orval",
              ),
              (
                  "Agenta", "Agenta-AI/agenta", "~4.7k ⭐", 6693,
                  "https://img.shields.io/pypi/dm/agenta?style=flat-square&label=PyPI%2Fmonth&color=555&labelColor=6B7280",
                  "https://pypi.org/project/agenta/",
              ),
              (
                  "html-to-markdown", "xberg-io/html-to-markdown", "865 ⭐", 482,
                  "https://img.shields.io/npm/dm/%40xberg-io%2Fhtml-to-markdown?style=flat-square&label=npm%2Fmonth&color=555&labelColor=6B7280",
                  "https://www.npmjs.com/package/@xberg-io/html-to-markdown",
              ),
              (
                  "LibreDB Studio", "libredb/libredb-studio", "628 ⭐", 782,
                  "https://img.shields.io/github/downloads/libredb/libredb-studio/total?style=flat-square&label=GitHub%20Releases&color=555&labelColor=6B7280",
                  "https://github.com/libredb/libredb-studio/releases",
              ),
              (
                  "agent-me", "jzjzzzzzzz/agent-me", "201 ⭐", 133,
                  "https://img.shields.io/badge/GitHub%20Releases-0-555?style=flat-square&labelColor=6B7280",
                  "https://github.com/jzjzzzzzzz/agent-me/releases",
              ),
              (
                  "codex-multi-launcher", "JqyModi/codex-multi-launcher", "133 ⭐", 19,
                  "https://img.shields.io/github/downloads/JqyModi/codex-multi-launcher/total?style=flat-square&label=GitHub%20Releases&color=555&labelColor=6B7280",
                  "https://github.com/JqyModi/codex-multi-launcher/releases",
              ),
              (
                  "Termlens", "vyncint/termlens", "19 ⭐", 321,
                  "https://img.shields.io/crates/d/termlens?style=flat-square&label=crates.io%20total&color=555&labelColor=6B7280",
                  "https://crates.io/crates/termlens",
              ),
              (
                  "soft-track", "soft-track/soft-track", "11 ⭐", 59,
                  "https://img.shields.io/badge/GitHub%20Releases-0-555?style=flat-square&labelColor=6B7280",
                  "https://github.com/soft-track/soft-track/releases",
              ),
              (
                  "DataSemVer", "IzanVil/datasemver", "1 ⭐", 7,
                  "https://img.shields.io/pypi/dm/datasemver?style=flat-square&label=PyPI%2Fmonth&color=555&labelColor=6B7280",
                  "https://pypi.org/project/datasemver/",
              ),
              (
                  "Protos", "guillermomolina/protos", "0 ⭐", 315,
                  "https://img.shields.io/github/downloads/guillermomolina/protos/total?style=flat-square&label=GitHub%20Releases&color=555&labelColor=6B7280",
                  "https://github.com/guillermomolina/protos/releases",
              ),
              (
                  "sotto-action", "getsotto/sotto-action", "0 ⭐", 25,
                  "https://img.shields.io/badge/GitHub%20Releases-0-555?style=flat-square&labelColor=6B7280",
                  "https://github.com/getsotto/sotto-action/releases",
              ),
              (
                  "TraceOS", "junixlabs/traceos", "0 ⭐", 23,
                  "https://img.shields.io/badge/GitHub%20Releases-0-555?style=flat-square&labelColor=6B7280",
                  "https://github.com/junixlabs/traceos/releases",
              ),
          ]

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "jabrailkhalil-profile-metrics",
          }

          def release_downloads(repo: str) -> int:
              total = 0
              page = 1
              while True:
                  url = f"https://api.github.com/repos/{repo}/releases?per_page=100&page={page}"
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=30) as response:
                      releases = json.load(response)
                  for release in releases:
                      total += sum(int(asset.get("download_count", 0)) for asset in release.get("assets", []))
                  if len(releases) < 100:
                      return total
                  page += 1

          values = {repo: release_downloads(repo) for _, repo, _, _, _, _ in entries}
          combined = sum(values.values())

          def human(n: int) -> str:
              if n >= 1_000_000:
                  return f"{n / 1_000_000:.1f}M"
              if n >= 1_000:
                  return f"{n / 1_000:.1f}k"
              return str(n)

          metrics_dir = Path("metrics")
          metrics_dir.mkdir(exist_ok=True)
          (metrics_dir / "upstream-downloads.json").write_text(
              json.dumps({
                  "metric": "GitHub release-asset downloads only",
                  "combined_downloads": combined,
                  "combined_downloads_human": human(combined),
                  "repositories": values,
              }, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          # The old custom SVG is no longer used; a normal Shields badge renders reliably on GitHub.
          (metrics_dir / "upstream-downloads.svg").unlink(missing_ok=True)

          rows = []
          for display, repo, stars, pr, badge_url, source_url in entries:
              downloads = f'<a href="{source_url}"><img height="20" alt="downloads" src="{badge_url}"></a>'
              rows.append(
                  f"| [{display}](https://github.com/{repo}) | {stars} | {downloads} | "
                  f"[#{pr}](https://github.com/{repo}/pull/{pr}) |"
              )

          value = human(combined)
          total_badge = (
              '<!-- release-downloads:start -->\n'
              f'[![GitHub release downloads](https://img.shields.io/badge/GitHub%20Release%20Downloads-{value}-555?style=flat-square&labelColor=6B7280)]'
              '(https://github.com/jabrailkhalil/jabrailkhalil/blob/main/metrics/upstream-downloads.json)\n'
              '<!-- release-downloads:end -->'
          )

          upstream = "\n".join([
              "## 🛰️ Upstream open-source",
              "",
              "**17 merged PRs across 17 upstream projects.** I contribute APIs, product fixes, packaging, CI, cross-platform behavior, regression tests, and documentation — not just drive-by edits.",
              "",
              "[![Merged upstream PRs](https://img.shields.io/badge/merged_upstream_PRs-17-2EA44F?style=flat-square&logo=github)](https://github.com/pulls?q=is%3Apr+author%3Ajabrailkhalil+is%3Amerged)",
              "[![Largest upstream](https://img.shields.io/badge/largest_upstream-224k%E2%AD%90-F59E0B?style=flat-square)](https://github.com/TheAlgorithms/Python)",
              "[![Combined upstream stars](https://img.shields.io/badge/combined_upstream_stars-420.6k%E2%AD%90-7C3AED?style=flat-square)](https://github.com/pulls?q=is%3Apr+author%3Ajabrailkhalil+is%3Amerged)",
              total_badge,
              "",
              "| Project | Stars | Downloads | Merged PR |",
              "| --- | ---: | --- | --- |",
              *rows,
          ])

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          start = readme.index("## 🛰️ Upstream open-source")
          end = readme.index("## 🧰 Core stack")
          readme_path.write_text(readme[:start] + upstream + "\n\n" + readme[end:], encoding="utf-8")
          PY

      - name: Commit refreshed metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md metrics/upstream-downloads.json
          git add -u metrics
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh upstream download metrics"
          git push