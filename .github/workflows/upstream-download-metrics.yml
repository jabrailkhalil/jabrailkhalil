name: Update upstream public download totals

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
  push:
    branches:
      - main
    paths:
      - .github/workflows/upstream-download-metrics.yml
      - .github/scripts/upstream_downloads.py
      - .github/scripts/source_only_reach.py

permissions:
  contents: write

concurrency:
  group: upstream-public-downloads
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect cumulative public download counters
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/upstream_downloads.py

      - name: Estimate reach for source-only projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/source_only_reach.py

      - name: Commit refreshed metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md metrics/upstream-section.md metrics/upstream-downloads.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh public download and reach totals"
          git push
