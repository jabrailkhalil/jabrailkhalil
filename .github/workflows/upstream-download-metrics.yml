name: Update upstream download metrics

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
  push:
    branches: [main]
    paths:
      - .github/workflows/upstream-download-metrics.yml

permissions:
  contents: write

concurrency:
  group: upstream-download-metrics
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Calculate and render distribution metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          entries = [
              (
                  "TheAlgorithms/Python",
                  "TheAlgorithms/Python",
                  "~224k ⭐",
                  15228,
                  "[![Distribution](https://img.shields.io/badge/distribution-source--only-64748B?style=flat-square)](https://github.com/TheAlgorithms/Python)",
              ),
              (
                  "Puppeteer",
                  "puppeteer/puppeteer",
                  "~95.6k ⭐",
                  15445,
                  "[![npm monthly](https://img.shields.io/npm/dm/puppeteer?style=flat-square&label=npm%2Fmonth)](https://www.npmjs.com/package/puppeteer)",
              ),
              (
                  "Roboflow Supervision",
                  "roboflow/supervision",
                  "~50.0k ⭐",
                  2557,
                  "[![PyPI monthly](https://img.shields.io/pypi/dm/supervision?style=flat-square&label=PyPI%2Fmonth)](https://pypi.org/project/supervision/)",
              ),
              (
                  "react-admin",
                  "marmelab/react-admin",
                  "~26.9k ⭐",
                  11367,
                  "[![npm monthly](https://img.shields.io/npm/dm/react-admin?style=flat-square&label=npm%2Fmonth)](https://www.npmjs.com/package/react-admin)",
              ),
              (
                  "VidBee",
                  "nexmoe/VidBee",
                  "~10.6k ⭐",
                  469,
                  "[![GitHub release downloads](https://img.shields.io/github/downloads/nexmoe/VidBee/total?style=flat-square&label=GitHub%20releases)](https://github.com/nexmoe/VidBee/releases)",
              ),
              (
                  "Orval",
                  "orval-labs/orval",
                  "~6.5k ⭐",
                  4074,
                  "[![npm monthly](https://img.shields.io/npm/dm/orval?style=flat-square&label=npm%2Fmonth)](https://www.npmjs.com/package/orval)",
              ),
              (
                  "Agenta",
                  "Agenta-AI/agenta",
                  "~4.7k ⭐",
                  6693,
                  "[![PyPI monthly](https://img.shields.io/pypi/dm/agenta?style=flat-square&label=PyPI%2Fmonth)](https://pypi.org/project/agenta/)",
              ),
              (
                  "html-to-markdown",
                  "xberg-io/html-to-markdown",
                  "865 ⭐",
                  482,
                  "[![npm monthly](https://img.shields.io/npm/dm/%40xberg-io%2Fhtml-to-markdown?style=flat-square&label=npm%2Fmonth)](https://www.npmjs.com/package/@xberg-io/html-to-markdown) <br> [![PyPI monthly](https://img.shields.io/pypi/dm/html-to-markdown?style=flat-square&label=PyPI%2Fmonth)](https://pypi.org/project/html-to-markdown/) <br> [![crates.io downloads](https://img.shields.io/crates/d/html-to-markdown-rs?style=flat-square&label=crates.io%20total)](https://crates.io/crates/html-to-markdown-rs)",
              ),
              (
                  "LibreDB Studio",
                  "libredb/libredb-studio",
                  "628 ⭐",
                  782,
                  "[![npm monthly](https://img.shields.io/npm/dm/%40libredb%2Fstudio?style=flat-square&label=npm%2Fmonth)](https://www.npmjs.com/package/@libredb/studio) <br> [![GitHub release downloads](https://img.shields.io/github/downloads/libredb/libredb-studio/total?style=flat-square&label=GitHub%20releases)](https://github.com/libredb/libredb-studio/releases)",
              ),
              (
                  "agent-me",
                  "jzjzzzzzzz/agent-me",
                  "201 ⭐",
                  133,
                  "[![Distribution](https://img.shields.io/badge/distribution-source%20%2F%20self--hosted-64748B?style=flat-square)](https://github.com/jzjzzzzzzz/agent-me#quick-start)",
              ),
              (
                  "codex-multi-launcher",
                  "JqyModi/codex-multi-launcher",
                  "133 ⭐",
                  19,
                  "[![GitHub release downloads](https://img.shields.io/github/downloads/JqyModi/codex-multi-launcher/total?style=flat-square&label=GitHub%20releases)](https://github.com/JqyModi/codex-multi-launcher/releases)",
              ),
              (
                  "Termlens",
                  "vyncint/termlens",
                  "19 ⭐",
                  321,
                  "[![crates.io downloads](https://img.shields.io/crates/d/termlens?style=flat-square&label=crates.io%20total)](https://crates.io/crates/termlens)",
              ),
              (
                  "soft-track",
                  "soft-track/soft-track",
                  "11 ⭐",
                  59,
                  "[![Distribution](https://img.shields.io/badge/distribution-Docker%20%2F%20self--hosted-2496ED?style=flat-square&logo=docker&logoColor=white)](https://github.com/soft-track/soft-track#readme)",
              ),
              (
                  "DataSemVer",
                  "IzanVil/datasemver",
                  "1 ⭐",
                  7,
                  "[![PyPI monthly](https://img.shields.io/pypi/dm/datasemver?style=flat-square&label=PyPI%2Fmonth)](https://pypi.org/project/datasemver/) <br> [![GitHub release downloads](https://img.shields.io/github/downloads/IzanVil/datasemver/total?style=flat-square&label=GitHub%20binaries)](https://github.com/IzanVil/datasemver/releases)",
              ),
              (
                  "Protos",
                  "guillermomolina/protos",
                  "0 ⭐",
                  315,
                  "[![Distribution](https://img.shields.io/badge/distribution-source%20build-64748B?style=flat-square)](https://github.com/guillermomolina/protos#getting-started)",
              ),
              (
                  "sotto-action",
                  "getsotto/sotto-action",
                  "0 ⭐",
                  25,
                  "[![GitHub Marketplace](https://img.shields.io/badge/distribution-GitHub%20Marketplace-2088FF?style=flat-square&logo=githubactions&logoColor=white)](https://github.com/marketplace/actions/sotto-setup)",
              ),
              (
                  "TraceOS",
                  "junixlabs/traceos",
                  "0 ⭐",
                  23,
                  "[![Distribution](https://img.shields.io/badge/distribution-pip%20from%20source-64748B?style=flat-square&logo=python&logoColor=white)](https://github.com/junixlabs/traceos#quick-start)",
              ),
          ]

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "jabrailkhalil-profile-metrics",
          }

          def release_downloads(repo: str) -> int:
              total = 0
              page = 1
              while True:
                  url = f"https://api.github.com/repos/{repo}/releases?per_page=100&page={page}"
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=30) as response:
                      releases = json.load(response)
                  for release in releases:
                      total += sum(int(asset.get("download_count", 0)) for asset in release.get("assets", []))
                  if len(releases) < 100:
                      return total
                  page += 1

          values = {repo: release_downloads(repo) for _, repo, _, _, _ in entries}
          combined = sum(values.values())

          def human(n: int) -> str:
              if n >= 1_000_000:
                  return f"{n / 1_000_000:.1f}M"
              if n >= 1_000:
                  return f"{n / 1_000:.1f}k"
              return str(n)

          out = {
              "metric": "GitHub release-asset downloads only",
              "combined_downloads": combined,
              "combined_downloads_human": human(combined),
              "repositories": values,
          }

          metrics_dir = Path("metrics")
          metrics_dir.mkdir(exist_ok=True)
          (metrics_dir / "upstream-downloads.json").write_text(
              json.dumps(out, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          value = human(combined)
          label = "GitHub release assets · listed repos"
          label_width = 210
          value_width = 72
          total_width = label_width + value_width
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{total_width}" height="20" role="img" aria-label="{label}: {value}">
          <title>{label}: {value}</title>
          <linearGradient id="s" x2="0" y2="100%">
            <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
            <stop offset="1" stop-opacity=".1"/>
          </linearGradient>
          <clipPath id="r"><rect width="{total_width}" height="20" rx="3"/></clipPath>
          <g clip-path="url(#r)">
            <rect width="{label_width}" height="20" fill="#555"/>
            <rect x="{label_width}" width="{value_width}" height="20" fill="#0EA5E9"/>
            <rect width="{total_width}" height="20" fill="url(#s)"/>
          </g>
          <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
            <text x="{label_width / 2}" y="15" fill="#010101" fill-opacity=".3">{label}</text>
            <text x="{label_width / 2}" y="14">{label}</text>
            <text x="{label_width + value_width / 2}" y="15" fill="#010101" fill-opacity=".3">{value}</text>
            <text x="{label_width + value_width / 2}" y="14">{value}</text>
          </g>
          </svg>'''
          (metrics_dir / "upstream-downloads.svg").write_text(svg, encoding="utf-8")

          rows = []
          for display, repo, stars, pr, reach in entries:
              rows.append(
                  f"| [{display}](https://github.com/{repo}) | {stars} | {reach} | "
                  f"[#{pr}](https://github.com/{repo}/pull/{pr}) |"
              )

          upstream = "\n".join([
              "## 🛰️ Upstream open-source",
              "",
              "**17 merged PRs across 17 upstream projects.** I contribute APIs, product fixes, packaging, CI, cross-platform behavior, regression tests, and documentation — not just drive-by edits.",
              "",
              "[![Merged upstream PRs](https://img.shields.io/badge/merged_upstream_PRs-17-2EA44F?style=flat-square&logo=github)](https://github.com/pulls?q=is%3Apr+author%3Ajabrailkhalil+is%3Amerged)",
              "[![Largest upstream](https://img.shields.io/badge/largest_upstream-224k%E2%AD%90-F59E0B?style=flat-square)](https://github.com/TheAlgorithms/Python)",
              "[![Combined upstream stars](https://img.shields.io/badge/combined_upstream_stars-420.6k%E2%AD%90-7C3AED?style=flat-square)](https://github.com/pulls?q=is%3Apr+author%3Ajabrailkhalil+is%3Amerged)",
              "[![GitHub release asset downloads](https://raw.githubusercontent.com/jabrailkhalil/jabrailkhalil/main/metrics/upstream-downloads.svg)](https://github.com/pulls?q=is%3Apr+author%3Ajabrailkhalil+is%3Amerged)",
              "",
              "> Sorted by current upstream GitHub stars (September 2026 snapshot). Distribution metrics use each project's primary public channel: npm/PyPI badges show the last 30 days; crates.io and GitHub release badges show registry/release totals. `source/self-hosted` means the project has no canonical public package-download counter. The combined badge above is **GitHub release assets only**, not a cross-registry sum.",
              "",
              "| Project | Stars | Distribution / downloads | Merged PR |",
              "| --- | ---: | --- | --- |",
              *rows,
          ])

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          start = readme.index("## 🛰️ Upstream open-source")
          end = readme.index("## 🧰 Core stack")
          readme_path.write_text(readme[:start] + upstream + "\n\n" + readme[end:], encoding="utf-8")
          PY

      - name: Commit refreshed metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md metrics/upstream-downloads.json metrics/upstream-downloads.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh upstream distribution metrics"
          git push