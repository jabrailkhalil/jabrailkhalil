name: Update upstream download metrics

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/upstream-download-metrics.yml

permissions:
  contents: write

concurrency:
  group: upstream-download-metrics
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Calculate GitHub release downloads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          repos = [
              "TheAlgorithms/Python",
              "puppeteer/puppeteer",
              "roboflow/supervision",
              "marmelab/react-admin",
              "nexmoe/VidBee",
              "orval-labs/orval",
              "Agenta-AI/agenta",
              "xberg-io/html-to-markdown",
              "libredb/libredb-studio",
              "jzjzzzzzzz/agent-me",
              "JqyModi/codex-multi-launcher",
              "vyncint/termlens",
              "soft-track/soft-track",
              "IzanVil/datasemver",
              "guillermomolina/protos",
              "getsotto/sotto-action",
              "junixlabs/traceos",
          ]

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "jabrailkhalil-profile-metrics",
          }

          def release_downloads(repo: str) -> int:
              total = 0
              page = 1
              while True:
                  url = f"https://api.github.com/repos/{repo}/releases?per_page=100&page={page}"
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=30) as response:
                      releases = json.load(response)
                  for release in releases:
                      total += sum(int(asset.get("download_count", 0)) for asset in release.get("assets", []))
                  if len(releases) < 100:
                      return total
                  page += 1

          values = {repo: release_downloads(repo) for repo in repos}
          combined = sum(values.values())

          def human(n: int) -> str:
              if n >= 1_000_000:
                  return f"{n / 1_000_000:.1f}M"
              if n >= 1_000:
                  return f"{n / 1_000:.1f}k"
              return str(n)

          out = {
              "metric": "GitHub release-asset downloads",
              "combined_downloads": combined,
              "combined_downloads_human": human(combined),
              "repositories": values,
          }

          metrics_dir = Path("metrics")
          metrics_dir.mkdir(exist_ok=True)
          (metrics_dir / "upstream-downloads.json").write_text(
              json.dumps(out, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          value = human(combined)
          label = "combined GitHub release downloads"
          label_width = 214
          value_width = 72
          total_width = label_width + value_width
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{total_width}" height="20" role="img" aria-label="{label}: {value}">
          <title>{label}: {value}</title>
          <linearGradient id="s" x2="0" y2="100%">
            <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
            <stop offset="1" stop-opacity=".1"/>
          </linearGradient>
          <clipPath id="r"><rect width="{total_width}" height="20" rx="3"/></clipPath>
          <g clip-path="url(#r)">
            <rect width="{label_width}" height="20" fill="#555"/>
            <rect x="{label_width}" width="{value_width}" height="20" fill="#0EA5E9"/>
            <rect width="{total_width}" height="20" fill="url(#s)"/>
          </g>
          <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
            <text x="{label_width / 2}" y="15" fill="#010101" fill-opacity=".3">{label}</text>
            <text x="{label_width / 2}" y="14">{label}</text>
            <text x="{label_width + value_width / 2}" y="15" fill="#010101" fill-opacity=".3">{value}</text>
            <text x="{label_width + value_width / 2}" y="14">{value}</text>
          </g>
          </svg>'''
          (metrics_dir / "upstream-downloads.svg").write_text(svg, encoding="utf-8")
          PY

      - name: Commit refreshed metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/upstream-downloads.json metrics/upstream-downloads.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh upstream download metrics"
          git push
